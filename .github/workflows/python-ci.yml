name: Python Catalog CI

on:
  push:
    branches:
      - main
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-validation:
    name: Validate catalog and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate application catalog
        run: python tools/validate_catalog.py

      - name: Run tests
        run: python -m pytest tests/python -v